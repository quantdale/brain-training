name: App CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: Mobile app build/typecheck/tests
    runs-on: ubuntu-latest
    # Fail fast on hung runners instead of burning the 360-minute default.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Validate durable repository state
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-repo-state.mjs

      # Registry generation must be reproducible (task 11.3: registry --check).
      - name: Registry generation check
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-game-registry.mjs --check

      # Provenance/version drift must be detected (task 2.6 / 11.3).
      - name: Provenance/version drift check
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-provenance.mjs --check

      # Parallel task-packet ownership must be non-overlapping (task 11.2).
      - name: Task-ownership check
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-task-ownership.cjs

      # Offline-first app must not ship network deps (GOVERNANCE offline boundary).
      - name: Offline boundary check
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-offline.mjs --check

      # QA harness self-test runs offline (no emulator) and guards regressions.
      - name: QA harness self-test
        working-directory: ${{ github.workspace }}
        run: node scripts/qa/autobot.mjs --self-test

      - name: Install dependencies
        run: npm ci

      # NOTE: `expo export` below does not generate `.expo/types` (typed routes
      # are produced by `expo start`), so plain `tsc --noEmit` is the CI
      # typecheck. If typed-route types become required, add a
      # type-generation step before typecheck.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Persist jest's transform cache between runs (the npm script itself is
      # untouched; the flag is workflow-owned). Big suites re-transform far
      # less, shortening future campaigns' CI feedback loops.
      - name: Restore jest transform cache
        uses: actions/cache@v6
        with:
          path: apps/mobile/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Unit tests (jest, CI mode)
        id: jest
        continue-on-error: true
        run: npm run test:ci -- --json --outputFile=jest-summary.json --cacheDirectory=.jest-cache

      - name: Validate Jest signal integrity
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/certification/validate-jest-signal.mjs --summary apps/mobile/jest-summary.json

      - name: Enforce Jest result
        if: always()
        run: |
          if [ "${{ steps.jest.outcome }}" != "success" ]; then
            echo "Jest failed; see the machine-readable summary artifact."
            exit 1
          fi

      - name: Upload Jest summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-summary-${{ github.run_id }}
          path: apps/mobile/jest-summary.json
          retention-days: 14
          if-no-files-found: error

      - name: Web export build smoke
        run: npx expo export --platform web

      # Failure diagnostics: keep the exported bundle for debugging export
      # regressions. Short retention; never needed on green runs.
      - name: Upload web-export output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-export-dist-${{ github.run_id }}
          path: apps/mobile/dist
          retention-days: 7
          if-no-files-found: ignore

      - name: Expo doctor
        run: npx expo-doctor
