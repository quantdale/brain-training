name: Android Build Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-smoke:
    name: Android clean native build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Full history: the provenance drift check needs the push's `before`
        # SHA (or, for PRs, the base sha) as a resolvable git base.
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build dependencies
        shell: bash
        # License acceptance is owned by android-actions/setup-android@v3
        # (`accept-android-sdk-licenses` defaults to true). A redundant
        # `yes | sdkmanager --licenses` here is a deterministic pipefail
        # failure once licenses are pre-accepted: sdkmanager exits without
        # reading stdin, `yes` dies of EPIPE, and the runner reports the
        # producer status despite sdkmanager succeeding (run 33930455910).
        # Keep the pinned install fail-closed and prove it via postcondition.
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          installed="$(sdkmanager --list_installed)"
          for pkg in "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"; do
            grep -qF "$pkg" <<< "$installed" || { echo "Missing installed SDK package: $pkg" >&2; exit 1; }
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate repository state
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-repo-state.mjs

      - name: Validate registry and provenance
        working-directory: ${{ github.workspace }}
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          node scripts/generate-game-registry.mjs --check
          # Resolve a real pre-change base: on push events origin/main == HEAD,
          # so diffing against it would make the provenance gate a silent no-op.
          base="$EVENT_BEFORE"
          if ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            base="$PR_BASE_SHA"
          fi
          if ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "Provenance base: $base"
          PROVENANCE_BASE_REF="$base" node scripts/validate-provenance.mjs --check

      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK from clean native state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p android/build-logs
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain -PreactNativeArchitectures=x86_64 2>&1 | tee build-logs/gradle-assemble-release.log

      - name: Verify APK and generated release boundaries
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" -gt 1000000
          permissions="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          if grep -q 'android.permission.RECORD_AUDIO' <<< "$permissions"; then
            echo 'RECORD_AUDIO unexpectedly present in packaged APK' >&2
            exit 1
          fi
          if grep -q 'android.permission.SYSTEM_ALERT_WINDOW' <<< "$permissions"; then
            echo 'SYSTEM_ALERT_WINDOW unexpectedly present in packaged APK' >&2
            exit 1
          fi
          echo "APK: $apk"
          sha256sum "$apk"
          echo "APK_BYTES=$(stat -c '%s' "$apk")"

      - name: Upload Android build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-smoke-logs-${{ github.run_id }}
          path: |
            apps/mobile/android/build-logs
            apps/mobile/android/app/build/outputs/logs
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APK on success
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk-${{ github.run_id }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
