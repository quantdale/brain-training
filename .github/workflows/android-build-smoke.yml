name: Android Build Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-smoke:
    name: Android clean native build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build dependencies
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate repository state
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-repo-state.mjs

      - name: Validate registry and provenance
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/generate-game-registry.mjs --check
          node scripts/validate-provenance.mjs --check

      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK from clean native state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p android/build-logs
          ./android/gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee android/build-logs/gradle-assemble-debug.log

      - name: Verify APK and generated release boundaries
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" -gt 1000000
          if grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml; then
            echo 'RECORD_AUDIO unexpectedly present in generated manifest' >&2
            exit 1
          fi
          if grep -q 'android.permission.SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml; then
            echo 'SYSTEM_ALERT_WINDOW unexpectedly present in generated manifest' >&2
            exit 1
          fi
          echo "APK: $apk"
          sha256sum "$apk"
          echo "APK_BYTES=$(stat -c '%s' "$apk")"

      - name: Upload Android build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-smoke-logs-${{ github.run_id }}
          path: |
            apps/mobile/android/build-logs
            apps/mobile/android/app/build/outputs/logs
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APK on success
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ github.run_id }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
