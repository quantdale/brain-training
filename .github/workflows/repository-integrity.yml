name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday 05:23 UTC (campaign 028, task 4.7; extended campaign 064):
    # catches time-based drift even when the repository sees no pushes —
    # dependency-audit waiver expiry, provenance waiver expiry, and
    # jest-skip waiver expiry (all three freshness checks run below).
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-state:
    runs-on: ubuntu-latest
    # Fail fast on hung runners instead of burning the 360-minute default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate durable repository state
        run: node scripts/validate-repo-state.mjs

      # High-confidence tracked-file secret patterns; fail closed without
      # printing matched values. Self-test first so the detector cannot
      # silently regress.
      - name: Validate tracked-file secret boundary
        run: |
          node scripts/validate-secrets.mjs --self-test
          node scripts/validate-secrets.mjs --check

      # Shell-hygiene guard for the `yes |` SIGPIPE / `|| true` masking
      # failure class that red-flagged the Android release gate (campaign 021).
      # Self-test first so the guard itself cannot silently regress.
      - name: Validate workflow shell hygiene
        run: |
          node scripts/validate-workflows.mjs --self-test
          node scripts/validate-workflows.mjs

      # Affected-area validation map (campaign 028, task 4.3): the
      # human-readable IMPACT_MAP.md table must match validate-affected.mjs
      # RULES at the pattern level, and the area list is printed for logs.
      - name: Validate affected-area map
        run: |
          node scripts/validate-affected.mjs --check-sync
          node scripts/validate-affected.mjs --list-areas

      # Self-tests for the remaining gates in this job (cheap, no install).
      # `validate-jest-signal` is additionally exercised end-to-end in app-ci.
      - name: Validator self-tests
        run: |
          node scripts/validate-offline.mjs --self-test
          node scripts/validate-dependency-audit.mjs --self-test
          node scripts/validate-expo-alignment.mjs --self-test
          node scripts/certification/validate-jest-signal.mjs --self-test
          node scripts/validate-provenance.mjs --self-test
          node scripts/validate-affected.mjs --self-test
          node scripts/qa/validate-runtime-qa-contract.mjs --self-test
          node scripts/certification/certify-clean-checkout.mjs --self-test

      # Time-based waiver freshness (campaign 064): expired waivers fail
      # closed; waivers inside their renewal window warn without failing.
      # This is what makes the weekly schedule meaningful for the two
      # expiring allowlists.
      - name: Allowlist freshness
        run: |
          node scripts/validate-provenance.mjs --check-allowlist
          node scripts/certification/validate-jest-signal.mjs --check-allowlist

      # Production dependency-audit gate (campaign 027). Fails closed:
      # exit 1 on an unallowlisted moderate+ advisory reachable from the
      # production tree; exit 2 (BLOCKED, never a silent pass) when npm
      # audit cannot run. Accepted build/dev-toolchain advisories and their
      # rationales live in the reviewed allowlist under
      # scripts/certification/.
      #
      # OWNERSHIP (campaign 064): this is the network-dependent gate's home.
      # App CI is hermetic by design and must not gain a network-dependent
      # audit step; `npm audit` runs here on push and on the weekly schedule,
      # and its BLOCKED status (exit 2) is an honest environment result, not
      # a product failure.
      #
      # BLOCKED vs FAILED (Change 069): a bare `run:` step cannot tell the two
      # apart, so an environment outage was reported as an ordinary red step
      # and any tolerance of it would report it as a pass. The exit code is
      # now branched explicitly and the classification is published three
      # ways: a `::error::` annotation, a distinct `classification=` step
      # output, and a job-summary line. Both branches fail the job — a
      # security gate that did not run must never be green — but the BLOCKED
      # branch states that the security posture is UNVERIFIED for that run
      # rather than implying a finding was detected.
      - name: Validate production dependency audit
        id: dep-audit
        run: |
          set -uo pipefail
          note() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          code=0
          node scripts/validate-dependency-audit.mjs || code=$?
          case "$code" in
            0)
              echo "classification=pass" >> "$GITHUB_OUTPUT"
              note "Dependency audit PASS - no unallowlisted moderate+ \
          production advisories."
              ;;
            1)
              echo "classification=failed" >> "$GITHUB_OUTPUT"
              note "Dependency audit FAILED - the gate RAN and found \
          unallowlisted moderate+ production advisories (a real finding)."
              echo "::error::Dependency audit FAILED (gate ran; found \
          unallowlisted moderate+ advisories)."
              exit 1
              ;;
            2)
              echo "classification=blocked" >> "$GITHUB_OUTPUT"
              note "Dependency audit BLOCKED - the gate DID NOT RUN (npm \
          audit/registry unavailable, or the allowlist is unreadable). The \
          production dependency security posture is UNVERIFIED for this \
          run; this is NOT evidence of a clean tree."
              echo "::error title=Dependency audit BLOCKED::The audit did \
          not run. Security posture is UNVERIFIED for this run - do not \
          read this as a pass. Exit 2 = could-not-run; exit 1 = \
          ran-and-failed."
              exit 1
              ;;
            *)
              echo "classification=unknown-exit-$code" >> "$GITHUB_OUTPUT"
              note "Dependency audit returned unexpected exit code $code; \
          the gate result is UNKNOWN and treated as unverified."
              echo "::error::Dependency audit exited $code (expected 0, 1 \
          or 2); gate result is unknown."
              exit 1
              ;;
          esac

      # Scheduled upstream-drift observation (Change 069).
      #
      # `npx expo-doctor` is deliberately NOT an App CI step: it resolves its
      # expected versions from https://api.expo.dev/v2/versions/latest, so it
      # reports repository failures for upstream patch releases and the
      # durable state then disagrees with CI. The hermetic replacement
      # (`scripts/validate-expo-alignment.mjs`, run in app-ci on every push)
      # answers the question that indicates a repository defect. This weekly
      # run keeps the upstream signal visible without letting a network fetch
      # flap the push path.
      #
      # The result is tolerated but never dropped: it is classified as UPSTREAM
      # DRIFT (not a repository defect) in the job summary, and the drift
      # classification step below enforces the tolerance by re-reading
      # `steps.expo-doctor.outcome`. This is the same rationale the `npm audit`
      # gate already uses for its network-dependent position.
      - name: Expo doctor (upstream drift observation)
        id: expo-doctor
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: npx expo-doctor

      - name: Classify Expo upstream drift
        if: always() && github.event_name == 'schedule'
        run: |
          set -uo pipefail
          outcome="${{ steps.expo-doctor.outcome }}"
          if [ "$outcome" = "success" ]; then
            drift="none - the installed tree matches the latest published \
          Expo expectations"
          else
            drift="DETECTED - expo-doctor reported a difference from \
          api.expo.dev's latest published versions. This is UPSTREAM DRIFT, \
          not a repository defect: the hermetic alignment gate \
          (validate-expo-alignment.mjs) passed in App CI. Re-baseline the \
          pins only after reviewing the upstream changelog."
          fi
          {
            echo "### Expo upstream drift (weekly, advisory)"
            echo ""
            echo "- expo-doctor outcome: \`$outcome\`"
            echo "- \`$drift\`"
            echo ""
            echo "App CI remains hermetic by design: no step in \
          \`app-ci.yml\` resolves an expectation from a third-party service."
          } >> "$GITHUB_STEP_SUMMARY"

      # OpenSpec change/spec validation. The CLI is pinned to an exact
      # version so CI validation is deterministic across runners; it runs
      # here (not app-ci) because it validates repository docs/specs and
      # needs no dependency install.
      #
      # `--strict` (Change 069): the non-strict form only reports failures and
      # leaves a malformed spec's requirement gaps unreported, so local and CI
      # validation could disagree about whether a change is actually
      # complete. The CLI is pinned to 1.9.0 — the version the repository's
      # planning artifacts were authored and last validated against
      # (`generatedBy: 1.9.0` in the openspec skills, and the version used for
      # the recorded 59/59 strict result).
      - name: OpenSpec validate (strict, pinned CLI 1.9.0)
        run: npx --yes @fission-ai/openspec@1.9.0 validate --all --strict
