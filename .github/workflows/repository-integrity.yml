name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday 05:23 UTC (campaign 028, task 4.7): catches time-based
    # drift — dependency-audit waiver expiry, stale jest-skip allowlist
    # entries — even when the repository sees no pushes.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-state:
    runs-on: ubuntu-latest
    # Fail fast on hung runners instead of burning the 360-minute default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate durable repository state
        run: node scripts/validate-repo-state.mjs

      # High-confidence tracked-file secret patterns; fail closed without
      # printing matched values. Self-test first so the detector cannot
      # silently regress.
      - name: Validate tracked-file secret boundary
        run: |
          node scripts/validate-secrets.mjs --self-test
          node scripts/validate-secrets.mjs --check

      # Shell-hygiene guard for the `yes |` SIGPIPE / `|| true` masking
      # failure class that red-flagged the Android release gate (campaign 021).
      # Self-test first so the guard itself cannot silently regress.
      - name: Validate workflow shell hygiene
        run: |
          node scripts/validate-workflows.mjs --self-test
          node scripts/validate-workflows.mjs

      # Affected-area validation map (campaign 028, task 4.3): the
      # human-readable IMPACT_MAP.md table must match validate-affected.mjs
      # RULES at the pattern level, and the area list is printed for logs.
      - name: Validate affected-area map
        run: |
          node scripts/validate-affected.mjs --check-sync
          node scripts/validate-affected.mjs --list-areas

      # Self-tests for the remaining gates in this job (cheap, no install).
      # `validate-jest-signal` is additionally exercised end-to-end in app-ci.
      - name: Validator self-tests
        run: |
          node scripts/validate-offline.mjs --self-test
          node scripts/validate-dependency-audit.mjs --self-test
          node scripts/certification/validate-jest-signal.mjs --self-test

      # Production dependency-audit gate (campaign 027). Fails closed:
      # exit 1 on an unallowlisted moderate+ advisory reachable from the
      # production tree; exit 2 (BLOCKED, never a silent pass) when npm
      # audit cannot run. Accepted build/dev-toolchain advisories and their
      # rationales live in scripts/certification/dependency-audit-allowlist.json.
      - name: Validate production dependency audit
        run: node scripts/validate-dependency-audit.mjs

      # OpenSpec change/spec validation. The CLI is pinned to an exact
      # version so CI validation is deterministic across runners; it runs
      # here (not app-ci) because it validates repository docs/specs and
      # needs no dependency install.
      - name: OpenSpec validate
        run: npx --yes @fission-ai/openspec@1.6.0 validate --all
